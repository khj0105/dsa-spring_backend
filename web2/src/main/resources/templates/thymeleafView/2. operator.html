<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>2. operator.html</title>
    </head>
    <body>
        <h2>1. 문자열 연결</h2>
        <p th:text="${str} + '님 안녕하세요.'"></p>
        <p th:text="|${str}님 안녕하세요. 환영합니다. |"></p>

        <p th:text="${str.equals('홍길동')}"></p>
        <p th:text="${#strings.isEmpty(str)}"></p>
        <p th:text="${#strings.substring(str, 1, 2)}"></p>

        <hr>

        <h2>2. 조건 및 논리 연산자</h2>
        <!-- 산술연산자: + - * / % -->
        <p>산술 연산 (num + 1): <span th:text="${num + 1}"></span></p>
        <!-- 비교연산자: < > <= >= == != , lt gt le ge eq ne -->
        <p>크기 비교 (gt 사용): <span th:text = "${num gt 100}"></span></p>
        <!-- 논리연산자: and or not -->
        <p>논리 연산 (and 사용): <span th:text="${num ge 1 and num le 100}"></span></p>
        <p>동등 비교 (eq 또는 ==): <span th:text="${str == '홍길동'}"></span></p>

        <hr>

        <h2>3. 자주 쓰는 포매팅 내장 객체</h2>
        <p>정수 콤마: <span th:text="${#numbers.formatInteger(inum, 3, 'COMMA')}"></span></p>
        <p>실수 포맷: <span th:text="${#numbers.formatDecimal(dnum, 3, 'COMMA', 2, 'POINT')}"></span></p>
        <p>날짜 포맷: <span th:text="${#temporals.format(localDateTime, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
    </body>
</html>
