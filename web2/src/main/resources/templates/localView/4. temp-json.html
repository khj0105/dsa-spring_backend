<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>4. temp-json.html</title>
      <script>
        window.onload = function() {
          // 1. 저장된 JSON 데이터 불러오기
          const savedData = JSON.parse(sessionStorage.getItem("formData")) || {};; // JSON은 객체를 문자열로 바꾼것, || {}가 있어야 nullExceptionPoint예외처리 안됨

          // 2. 값 반영
          document.querySelector('#name').value = savedData.name || "";
          document.querySelector('#message').value = savedData.message || "";
          document.querySelector('#phone').value = savedData.phone || "";

          // 3. JSON 단위 저장
          function saveFormData() {
            const data = {
                name: document.querySelector('#name').value,
                message: document.querySelector('#message').value,
                phone: document.querySelector('#phone').value
            };
            sessionStorage.setItem("formData", JSON.stringify(data));
          }

          // 4. 입력할 때마다 저장
          document.querySelector('#name').addEventListener("input", saveFormData);
          document.querySelector('#message').addEventListener("input", saveFormData);
          document.querySelector('#phone').addEventListener("input", saveFormData);
        }
      </script>
  </head>
  <body>
    <h2>문의 하기</h2>
    <form>
      이름: <input type="text" id="name"><br>
      메시지: <input type="text" id="message"><br>
      핸드폰: <input type="text" id="phone"><br>
      <button type="submit">보내기</button>
    </form>
  </body>
</html>
