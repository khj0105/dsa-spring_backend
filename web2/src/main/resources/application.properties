spring.application.name=web2

## 경로 ######################################################
# 서버에 접속하기위한 기본 경로 설정 👉 http://localhost:9992/
server.port=9992
server.servlet.context-path=/

## 로그 ######################################################
# 전체를 대상으로 로깅 레벨 지정(Logback)
logging.level.root=info
# 특정 패키지를 대상으로 로깅 레벨 지정
logging.level.net.datasa.web2=debug

# Lombok(@Slf4j)은 “로거 객체를 만들어주는 도구”

# 💡로그? : 시스템의 동작 상태, 오류 등을 출력해주는 메시지
# error  : 심각한 오류. 프로그램이 제대로 동작하지 않을 가능성이 있음
# warn   : 경고. 아직 문제는 없지만 주의가 필요한 상황
# info   : 일반적인 정보. 정상 동작에 대한 메시지
# debug  : 디버깅용. 개발자가 로직 흐름을 확인하기 위한 상세 정보
# trace  : 가장 상세한 로그. 거의 모든 내부 흐름 출력
# error > warn > info > debug > trace

# 로그 파일 이름 설정
# C:\'본인이 지정한 Workspace Directory'\web2\logs 에 저장
logging.file.name=logs/myapp.log
# 최대 파일 크기 (롤링 트리거)
logging.logback.rollingpolicy.max-file-size=10MB
# 최대 보존 파일 일수(이전 날짜의 로그 파일을 며칠까지 보관할지 지정, 최근 30일 동안의 로그 파일만 보관하고 그 이전 파일은 삭제)
logging.logback.rollingpolicy.max-history=30

## 세션 ######################################################
# 세션 만료 시간 설정 - 단위 : s (seconds), m (minutes), h (hours), d (days)
server.servlet.session.timeout=60m
# 세션 추적 방식을 쿠키만 사용
server.servlet.session.tracking-modes=cookie
