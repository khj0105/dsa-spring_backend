## 스프링의 검증 오류 메시지 관리 파일 (자동 인식)
# messages.properties라는 이름은 스프링이 기본값(Default)으로 자동 인식하도록 설계해 둔 표준 약속(Convention)
# 배치 경로: src/main/resources/messages.properties


# 우선순위(규칙)로 파일에서 키(Key)를 찾음
#   1순위: 어노테이션이름.객체명(넘겨받은 모델명).필드명
#   2순위: 어노테이션이름.필드명
#   3순위: 어노테이션이름.데이터타입
#   4순위: 어노테이션이름


## 글로벌 에러 (Global Error)
# 스프링의 BindingResult는 글로벌 에러를 찾을 때 에러코드.객체명 또는 에러코드 순서로 규칙을 조합해서 찾음
# 읽는 규칙: 에러코드.객체명 (ModelAttribute에 지정한 이름이 person)
DuplicateUserError.person=[properties 파일 메시지] 이미 동일한 정보(이름과 전화번호)로 가입된 회원이 존재합니다.

## 필드 에러 (Field Error)
# === name 필드 관련 메시지 모음 ===
# 1. @NotBlank 대응
NotBlank.person.name=[properties 파일 메시지] 이름은 필수 항목입니다. 입력해 주세요.
# 2. @Size 대응 (최소/최대 값을 {2}, {1} 파라미터로 동적 할당 가능)
Size.name=[properties 파일 메시지] 이름은 {2}자 이상, {1}자 이하로 입력해 주세요.
# 3. @Pattern 대응 (한글만)
Pattern.name=[properties 파일 메시지] 이름에는 한글만 입력 가능합니다.

# === password 필드 관련 메시지 모음 ===
# 4. @Pattern 대응 (비밀번호는 8~20자이며, 영문/숫자/특수문자 포함)
Pattern.person.password=[properties 파일 메시지] 비밀번호는 8~20자이며, 영문/숫자/특수문자를 포함해야 합니다.
# 5. @NotBlank 대응
NotBlank.person.password=[properties 파일 메시지] 비밀번호는 필수 항목입니다. 입력해 주세요.

# === phone 필드 관련 메시지 모음 ===
# 6. @Pattern 대응 (하이픈 없는 번호)
Pattern.person.phone=[properties 파일 메시지] 전화번호 형식은 010-1234-5678 형식입니다.

# === 4순위(공통 최하위)의 올바른 활용 예시 ===
# 시스템 전체에서 아무 설정도 안 한 @Pattern 에러가 나면 보여줄 공통 메시지
Pattern=[properties 파일 메시지] 올바른 형식으로 입력해 주세요.
NotBlank=[properties 파일 메시지] 필수 입력 항목입니다.