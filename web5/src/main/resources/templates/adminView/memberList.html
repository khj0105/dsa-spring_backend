<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>memberList.html</title>
        <link rel="stylesheet" th:href="@{/css/main.css}">
        <script>
            window.onload = function() {
            // 권한 변경
                const roleBtn = document.querySelectorAll('.roleBtn');
                const enabledBtn = document.querySelectorAll('.enabledBtn');

                roleBtn.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        let id = this.dataset.id;
                        if (confirm('정말 권한을 변경하시겠습니까?')) {
                            location.href = `/admin/updateRole/${id}`;
                        }
                    });
                });

            // 활성화/비활성화 변경
            // 이벤트 위임 방식
                    document.querySelector('tbody')
                            .addEventListener('click', function(e) {
                        // 내가 클릭한 지점부터 시작해서 부모요소들을 향해 위로 올라감
                        const btn = e.target.closest('.enabledBtn');

                        console.log('btn: ', btn);
                        console.log('e.currentTarget: ', e.currentTarget);
                        console.log('this: ', this);

                        // '.enabledBtn' 을 클릭한게 아니면 무시
                        if (!btn) {
                            console.log('활성화 버튼 아님');
                            return;
                        }

                        // dataset에서 값 가져오기
                        let id = btn.dataset.id;
                        let enabled = btn.dataset.enabled;
                        let result = enabled === "true" ? "비활성화" : "활성화";

                        if (confirm(`정말 ${result} 하시겠습니까?`)) {
                            location.href = `/admin/updateEnabled/${id}/${enabled}`;
                        }
                    });
                }
        </script>
        <!--enableBtn.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        let id = this.dataset.id;

                        if(confirm('정말 상태 변경 하시겠습니까?')) {
                           this.dataset.enabled ===
                           enabled === 'true'
                           location.href = `/admin/updateState/${id}?enabled=${enabled}`;
                        }
                    });-->
    </head>
    <body>
        <header>
            <h1>[ 회원 목록 ]</h1>
        </header>
        <section>
            <table>
                <caption th:text="|${#authentication.name}님 로그인 중|" style="text-align: left;"></caption>

                <!-- 회원 검색 -->
                <form th:action="@{/admin/list}" method="get">
                        <input type="text" name="keyword" placeholder="ID 포함 검색" th:value="${keyword}">
                        <input type="submit" value="검색">
                </form>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>EMAIL</th>
                        <th style="width: 150px;">PHONE</th>
                        <th>ADDRESS</th>
                        <th>ROLENAME</th>
                        <th>ENABLED</th>
                        <th>변경</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${memberList}"
                        th:if="${m.memberId} != ${#authentication.name}">
                        <td th:text="${m.memberId}"></td>
                        <td th:text="${m.memberName}"></td>
                        <td th:text="${m.email}"></td>
                        <td th:text="${m.phone}"></td>
                        <td th:text="${m.address}"></td>
                        <td th:text="${m.rolename}"></td>
                        <td th:text="${m.enabled}"></td>
                        <td>
                            <input type="button" value="권한변경" class="roleBtn" th:data-id="${m.memberId}">
                            <input type="button" class="enabledBtn" th:value="${m.enabled} ? '비활성화' : '활성화'"
                                                                    th:data-id="${m.memberId}"
                                                                    th:data-enabled="${m.enabled}">
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </body>
</html>
