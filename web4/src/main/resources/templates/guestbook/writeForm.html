<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>web4</title>

    <link rel="stylesheet" th:href="@{/css/writeForm.css}">
    <!-- 경고창 alert() 디자인해주는 JS 라이브러리 -->
    <script th:src="@{https://cdn.jsdelivr.net/npm/sweetalert2@11}"></script>
    <!-- 유효성 검사 JS 참조 -->
    <script th:src="@{/js/validation.js}"></script>
</head>
<body>

    <div class="form-container">
        <h2>글쓰기</h2>
        <form th:action="@{/guestbook/write}" method="post">
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" placeholder="이름을 입력하세요">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">
            </div>
            <div class="form-group">
                <label for="message">내용<span id="cnt">(0 / 200)</span></label>
                <textarea id="message" name="message" maxlength="200"
                          placeholder="내용을 입력하세요"></textarea>
            </div>
            <button type="submit">저장</button>
        </form>
    </div>

</body>
</html>
