<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>향수 설문조사</title>
    <!-- CSS 참조 -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- JS 참조 -->
    <script src="/js/main.js"></script>
</head>
<body>
<div class="container">
    <form th:action="@{/perfume/add}" method="post" id="addForm">
        <h1>향수 설문조사</h1>

        <label for="name" style="color:red">이름</label><br>
        <input type="text" name="name" id="name" placeholder="이름을 입력하세요."
               style="width:100%">
        <br><br>

        <label for="gender" style="color:orange">성별</label><br>
        <select name="gender" id="gender" style="width:100%">
            <option value="">선택하세요</option>
            <option value="남성">남성</option>
            <option value="여성">여성</option>
        </select>
        <br><br>
        <label for="age" style="color:yellow">나이</label><br>
        <input type="text" name="age" id="age" placeholder="나이를 입력하세요." style="width:100%">
        <br><br>
        <label for="favoriteScent" style="color:green">가장 좋아하는 향기</label><br>
        <select name="favoriteScent" id="favoriteScent" style="width:100%">
            <option value="">선택하세요</option>
            <option value="꽃향">꽃향</option>
            <option value="우디향">우디향</option>
            <option value="과일향">과일향</option>
            <option value="시트러스향">시트러스향</option>
            <option value="스파이시향">스파이시향</option>
        </select><br><br>
        <p style="color:deepskyblue">향수를 얼마나 자주 사용하시나요?</p>
        <span>
                <input type="radio" id="매일" name="usageFrequency" value="매일">
                <label for="매일">매일</label>
            </span>
        <span>
                <input type="radio" id="주 2-4회" name="usageFrequency" value="주 2-4회">
                <label for="주 2-4회">주 2-4회</label>
            </span>
        <span>
                <input type="radio" id="가끔" name="usageFrequency" value="가끔">
                <label for="가끔">가끔</label>
            </span>
        <span>
                <input type="radio" id="사용하지 않음" name="usageFrequency" value="사용하지 않음" checked>
                <label for="사용하지 않음">사용하지 않음</label>
            </span>
        <br><br>
        <label for="favoriteBrand" style="color:blueviolet">선호하는 향수 브랜드</label><br>
        <input type="text" name="favoriteBrand" id="favoriteBrand" placeholder="브랜드를 입력하세요" style="width:100%">
        <br><br>

        <label for="purchaseBudget" style="color:pink">향수 구매시 예상 예산</label><br>
        <select name="purchaseBudget" id="purchaseBudget" style="width:100%">
            <option value="5-10만원">5-10만원</option>
            <option value="10-15만원">10-15만원</option>
            <option value="15-20만원">15-20만원</option>
            <option value="20-25만원">20-25만원</option>
            <option value="25-30만원">25-30만원</option>
            <option value="30만원 이상">30만원 이상</option>
        </select><br><br>

        <label for="comments" style="color:dodgerblue">추가 의견</label><br>
        <textarea name="comments" id="comments" style="width:100%"></textarea><br><br>

        <div class="box-container">
            <button type="submit" class="container whiteText ao" style="background-color: dodgerblue">설문 제출</button>
            <button type="button" onclick="location.href='/perfume/result'" class="container whiteText ao"
                    style="background-color: gray">설문 결과
            </button>
        </div>

    </form>
</div>
</body>
</html>
