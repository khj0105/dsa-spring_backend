spring.application.name=web3

## 경로 ######################################################
server.port=9993
server.servlet.context-path=/


## 로그 ######################################################
# 전체를 대상으로 로깅 레벨 지정(Logback)
# error > warn > info > debug > trace
logging.level.root=info
# 특정 패키지를 대상으로 로깅 레벨 지정
logging.level.net.datasa.web3=debug


## 세션 ######################################################
# 세션 만료 시간 설정 - 단위 : s (seconds), m (minutes), h (hours), d (days)
server.servlet.session.timeout=60m
# 세션 추적 방식을 쿠키만 사용
server.servlet.session.tracking-modes=cookie


## MySQL ####################################################
# 프로젝트의 바로 하위 디렉토리(build.gradle, .gitignore 파일들과 동일한 위치일 것)에 .env 파일 생성

# 인텔리제이 플러그인(EnvFile) 도움 없이, 스프링 부트가 스스로 .env 파일을 직접 읽어서 연동하게 만드는 설정
# 안먹히면 구성편집에서 Enable EnvFile 체크하고 아래 + 버튼 눌러서 직접 env 파일 가져오기
spring.config.import=optional:file:.env[.properties]

# 데이터베이스 접속 정보
# 연결 주소 (localhost 및 포트, 데이터베이스명은 본인 환경에 맞게 수정할 것.)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


## JPA ######################################################
# JPA 설정
# JPA가 실행하는 SQL을 콘솔에 출력하도록 하는 옵션
spring.jpa.show-sql=true
# DDL(스키마) 자동 생성 전략 - JPA가 DB 스키마를 자동으로 생성·관리할 것인지를 결정하기 위해
#   none        아무 작업도 하지 않음
#   validate    DB와 엔티티가 같은지 확인만 하고, 다르면 에러 발생
#   update      있는 테이블은 유지하되, 변화된 스키마를 자동 업데이트
#   create      서버 실행 시 스키마를 새로 생성(기존 테이블 삭제)
#   create-drop create와 같지만 종료 시 테이블 삭제
spring.jpa.hibernate.ddl-auto=validate
# 데이터베이스마다 SQL 문법이 조금씩 다르기 때문에, MySQL 버전을 사용하겠다는 설정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# SQL을 콘솔에 포맷팅 해서 출력
spring.jpa.properties.hibernate.format_sql=true
# SQL 바인딩 파라미터 로깅 (Spring Boot 버전에 따라 설정이 다를 수 있어 가장 확실한 2가지 모두 추가)
logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.org.hibernate.orm.results.mapping=trace


# 설정 값
service.impl=impl1