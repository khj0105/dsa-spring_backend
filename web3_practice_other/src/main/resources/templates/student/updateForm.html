<!DOCTYPE html>
<html xmlns:th="thyemeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>학생정보 수정</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<script th:src="@{/js/validation.js}"></script>
</head>
<body>

	<h1>[ 학생정보수정 ]</h1>

	<form th:action="@{/student/update/{uid}(uid=${student.studentId})}" method="post">
		<table>
			<tr>
				<th>이름</th>
				<td>
					<!--<input type="hidden" name="studentId" th:value="${student.studentId}"> 경로로 표시하지 않았을때 방법-->
					<input type="text" name="name" id="name" th:value="${student.name}">
				</td>
			</tr>
			<tr>
				<th>전공</th>
				<td>
					<input type="text" name="major" id="major" th:value="${student.major}">
				</td>
			</tr>
			<tr>
				<th>자바</th>
				<!--
					th:field="*{필드명}" 는 자동으로 아래 작업을 수행:
					------------------------------------------------------------------------------
					기능								설명
					------------------------------------------------------------------------------
					name="java"						필드명에 맞춰 name 속성 자동 지정
					id="java"						id도 자동으로 지정 가능
					value="현재 값"					모델 객체의 필드 값 자동으로 적용
					selected, checked 속성 자동 설정	<select>나 <input type="radio">,
													<input type="checkbox">에서 사용 시 자동 선택 처리
				-->
				<td th:object="${student}">
					<label th:for="java">Java 등급 선택:</label>
					<select th:field="*{java}">
							<!--th:value="${student.java}"
								id="java"
								name="java"-->
						<option value="">-- 선택 --</option>
						<option value="상">상</option>
						<option value="중">중</option>
						<option value="하">하</option>
					</select>
				</td>
			</tr>
			<tr>
				<th>데이터베이스</th>
				<td th:object="${student}">
					<label th:for="db">DB 등급 선택:</label>
					<select th:field="*{db}">
						<option value="">-- 선택 --</option>
						<option value="상">상</option>
						<option value="중">중</option>
						<option value="하">하</option>
					</select>
				</td>
			</tr>
			<tr>
				<th>웹</th>
				<td th:object="${student}">
					<label th:for="web">web 등급 선택:</label>
					<select th:field="*{web}">
						<option value="">-- 선택 --</option>
						<option value="상">상</option>
						<option value="중">중</option>
						<option value="하">하</option>
					</select>
				</td>
			</tr>
			<tr>
				<td colspan="2">
					<input type="submit" value="등록">
					<input type="button" value="홈" id="home">
				</td>
			</tr>
		</table>
	</form>

</body>
</html>
