<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>select.html</title>
        <style>
            table { margin: 20px auto; border-collapse: collapse; width: 40%; }
            th, td { border: 1px solid #ddd; padding: 15px; }
            th { background-color: #f9f7e8; text-align: center; width: 30%; }
            h1 { text-align: center; }
            .nav-link { text-align: center; margin-top: 15px; }
        </style>
    </head>
    <body>
        <h1>[ 학생정보 ]</h1>

        <table th:if="${student != null}">
            <tr>
                <th>학번</th>
                <td th:text="${student.studentId}"></td>
            </tr>
            <tr>
                <th>이름</th>
                <td th:text="${student.name}"></td>
            </tr>
            <tr>
                <th>전공</th>
                <td th:text="${student.major}"></td>
            </tr>
            <tr>
                <th>이해도</th>
                <td>
                    JAVA: <span th:text="${student.java}"></span><br>
                    DB: <span th:text="${student.db}"></span><br>
                    WEB: <span th:text="${student.web}"></span>
                </td>
            </tr>
        </table>

        <div class="nav-link">
            <a th:href="@{/student/list}">목록으로 가기</a>
        </div>
    </body>
</html>
