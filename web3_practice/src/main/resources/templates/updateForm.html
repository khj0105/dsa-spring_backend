<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>updateForm.html</title>
        <style>
            table { margin: 20px auto; border-collapse: collapse; width: 50%; }
            th, td { border: 1px solid #ddd; padding: 15px; }
            th { background-color: #f9f7e8; width: 30%; text-align: center; }
            h1 { text-align: center; }
            .btn-box { text-align: center; margin-top: 15px; }
            .btn-box button, .btn-box a { padding: 8px 16px; margin: 0 5px; background-color: #007bff; color: white; border: none; text-decoration: none; cursor: pointer; }
            select, input[type="text"] { width: 95%; padding: 5px; }
        </style>
    </head>
    <body>
        <h1>[ 학생정보수정 ]</h1>

        <form th:action="@{/student/update}" method="post" th:if="${student != null}">
            <input type="hidden" name="studentId" th:value="${student.studentId}">

            <table>
                <tr>
                    <th>이름</th>
                    <td><input type="text" name="name" th:value="${student.name}"></td>
                </tr>
                <tr>
                    <th>전공</th>
                    <td><input type="text" name="major" th:value="${student.major}"></td>
                </tr>
                <tr>
                    <th>자바</th>
                    <td>
                        Java 등급 선택:<br>
                        <select name="java">
                            <option value="상" th:selected="${student.java == '상'}">상</option>
                            <option value="중" th:selected="${student.java == '중'}">중</option>
                            <option value="하" th:selected="${student.java == '하'}">하</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>데이터베이스</th>
                    <td>
                        DB 등급 선택:<br>
                        <select name="db">
                            <option value="상" th:selected="${student.db == '상'}">상</option>
                            <option value="중" th:selected="${student.db == '중'}">중</option>
                            <option value="하" th:selected="${student.db == '하'}">하</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>웹</th>
                    <td>
                        web 등급 선택:<br>
                        <select name="web">
                            <option value="상" th:selected="${student.web == '상'}">상</option>
                            <option value="중" th:selected="${student.web == '중'}">중</option>
                            <option value="하" th:selected="${student.web == '하'}">하</option>
                        </select>
                    </td>
                </tr>
            </table>
            <div class="btn-box">
                <button type="submit">등록</button>
                <a th:href="@{/student/list}">홈</a>
            </div>
        </form>
    </body>
</html>
