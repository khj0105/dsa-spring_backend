<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
  <head>
      <meta charset="UTF-8">
      <title>order.html</title>
      <link rel="stylesheet" href="/css/order.css">
  </head>
  <body>
  <div class="top-nav">
      <a href="" class="btn-order">주문하기</a>
      <a href="" class="btn-list">주문내역보기</a>
  </div>

    <div class="card">
        <h2>치킨 주문하기</h2>
        <form>
            <div class="form-group">
                <label>치킨 종류:</label><br>
                <select>
                    <option value="none">-- 치킨 종류를 선택하세요 --</option>
                    <option value="fried">후라이드 치킨</option>
                    <option value="sauced">양념 치킨</option>
                    <option value="soy">간장 치킨</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">수량:</label><br>
                <input type="text" id="quantity" name="quantity" placeholder="1 이상">
            </div>
            <div class="form-group">
                <label>추가 메뉴:</label> <br>
                <div class="option-item">
                    <input type="checkbox">
                    <label>무 추가(+1,000원)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox">
                    <label>콜라 추가(+2,000원)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox">
                    <label>감자튀김(+3,000원)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox">
                    <label>소떡소떡(+4,000원)</label>
                </div>
            </div>
            <div class="form-group">
                <div class="option-item">
                    <label>배달 방식:</label> <br>

                </div>
                <div class="option-item">
                    <input type="radio" id="home" name="deliveryType" value="home">
                    <label for="cheap">알뜰배달 (무료)</label>
                </div>
                <div class="option-item">
                    <input type="radio" id="cheap" name="deliveryType" value="cheap">
                    <label for="home">한집배달 (+1,000원)</label>
                </div>
            </div>

            <input type="submit" value="주문하기">
        </form>
    </div>
  </body>
</html>
