<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
  <head>
      <meta charset="UTF-8">
      <title>order.html</title>
      <link rel="stylesheet" href="/css/order.css">
      <script>
          const btnOrder = document.getElementById('btnOrder');
          const errorMsg = document.getElementById('errorMsg');
          const modal = document.getElementById('orderModal');
          let orderData = null;

          btnOrder.addEventListener('click', () => {
              const chickenSelect = document.getElementById('chickenType');
              const chickenOption = chickenSelect.options[chickenSelect.selectedIndex];
              const chickenValue = chickenSelect.value;
              const chickenPrice = Number(chickenOption.dataset.price);
              const chickenLabel = chickenOption.textContent;

              const quantityInput = document.getElementById('quantity');
              const quantity = parseInt(quantityInput.value, 10);

              if (!chickenValue) {
                  showError('치킨 종류를 선택하세요.');
                  return;
              }
              if (!quantity || quantity < 1) {
                  showError('수량은 1개 이상 입력하세요.');
                  return;
              }
              errorMsg.style.display = 'none';

              const extraChecks = document.querySelectorAll('.extra-option:checked');
              let extraTotal = 0;
              const extraNames = [];
              extraChecks.forEach(chk => {
                  extraTotal += Number(chk.dataset.price);
                  extraNames.push(`${chk.value} (+${Number(chk.dataset.price).toLocaleString()}원)`);
              });

              const deliveryInput = document.querySelector('input[name="deliveryType"]:checked');
              const deliveryPrice = Number(deliveryInput.dataset.price);
              const deliveryLabel = deliveryInput.nextElementSibling.textContent;

              const totalPrice = chickenPrice * quantity + extraTotal + deliveryPrice;

              orderData = {
                  chickenType: chickenLabel,
                  chickenPrice: chickenPrice,
                  quantity: quantity,
                  extraOptions: extraNames.length ? extraNames.join(', ') : '없음',
                  extraTotalPrice: extraTotal,
                  deliveryType: deliveryLabel,
                  deliveryPrice: deliveryPrice,
                  totalPrice: totalPrice
              };

              document.getElementById('modalChickenType').textContent = chickenLabel;
              document.getElementById('modalQuantity').textContent = quantity + '개';
              document.getElementById('modalExtraOptions').textContent = orderData.extraOptions;
              document.getElementById('modalDeliveryType').textContent = deliveryLabel;
              document.getElementById('modalTotalPrice').textContent = totalPrice.toLocaleString() + '원';

              modal.style.display = 'flex';
          });

          function showError(msg) {
              errorMsg.textContent = msg;
              errorMsg.style.display = 'block';
          }

          document.getElementById('closeModal').addEventListener('click', () => {
              modal.style.display = 'none';
          });

          document.getElementById('confirmOrder').addEventListener('click', () => {
              fetch('/chicken/order', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(orderData)
              })
              .then(res => {
                  if (!res.ok) throw new Error('주문 저장 실패');
                  return res.text();
              })
              .then(() => {
                  window.location.href = '/chicken/list';
              })
              .catch(err => alert(err.message));
          });
      </script>
  </head>
  <body>
  <div class="top-nav">
      <a href="@{/chicken/order}" class="btn-order">주문하기</a>
      <a href="@{/chicken/list}" class="btn-list">주문내역보기</a>
  </div>

    <div class="card">
        <h2>치킨 주문하기</h2>
        <form>
            <div class="form-group">
                <label>치킨 종류:</label><br>
                <select>
                    <option value="none">-- 치킨 종류를 선택하세요 --</option>
                    <option value="fried">후라이드 치킨</option>
                    <option value="sauced">양념 치킨</option>
                    <option value="soy">간장 치킨</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">수량:</label><br>
                <input type="text" id="quantity" name="quantity" placeholder="1 이상">
            </div>
            <div class="form-group">
                <label>추가 메뉴:</label> <br>
                <div class="option-item">
                    <input type="checkbox">
                    <label>무 추가(+1,000원)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox">
                    <label>콜라 추가(+2,000원)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox">
                    <label>감자튀김(+3,000원)</label>
                </div>
                <div class="option-item">
                    <input type="checkbox">
                    <label>소떡소떡(+4,000원)</label>
                </div>
            </div>
            <div class="form-group">
                <div class="option-item">
                    <label>배달 방식:</label> <br>

                </div>
                <div class="option-item">
                    <input type="radio" id="home" name="deliveryType" value="home">
                    <label for="cheap">알뜰배달 (무료)</label>
                </div>
                <div class="option-item">
                    <input type="radio" id="cheap" name="deliveryType" value="cheap">
                    <label for="home">한집배달 (+1,000원)</label>
                </div>
            </div>

            <input type="submit" value="주문하기">
        </form>
    </div>

  <!-- 주문 확인 모달 -->
  <div id="orderModal" class="modal-overlay" style="display:none;">
      <div class="modal-box">
          <button type="button" id="closeModal" class="modal-close">X</button>
          <h3>주문 영수증</h3>
          <div class="modal-row">
              <span class="modal-label">치킨 종류:</span>
              <span id="modalChickenType" class="modal-value highlight"></span>
          </div>
          <div class="modal-row">
              <span class="modal-label">수량:</span>
              <span id="modalQuantity" class="modal-value highlight"></span>
          </div>
          <div class="modal-row">
              <span class="modal-label">추가 메뉴:</span>
          </div>
          <div class="modal-row">
              <span id="modalExtraOptions" class="modal-value extra"></span>
          </div>
          <div class="modal-row">
              <span class="modal-label">배달 방식:</span>
              <span id="modalDeliveryType" class="modal-value highlight"></span>
          </div>
          <div class="modal-row total-row">
              <span class="modal-label">총 결제 금액:</span>
              <span id="modalTotalPrice" class="modal-value total"></span>
          </div>
          <button type="button" id="confirmOrder" class="btn-confirm">주문확정</button>
      </div>
  </div>
  </body>
</html>
